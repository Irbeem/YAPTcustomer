<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เพิ่มข้อมูลใน data.json (GitHub)</title>
  <style>
    input, textarea {
      display: block;
      margin-bottom: 10px;
      padding: 5px;
      width: 300px;
    }
    label {
      font-weight: bold;
      margin-top: 10px;
    }
    input.duplicate {
      border: 2px solid red;
      background-color: #ffe6e6;
    }
    button {
      margin-top: 10px;
      padding: 10px;
    }
    pre {
      background: #f0f0f0;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h2>📋 เพิ่มข้อมูลใหม่ใน <code>data.json</code> บน GitHub</h2>

  <form id="form">
    <div id="form-container"></div>
    <button type="submit">➕ เพิ่มข้อมูล</button>
  </form>

  <hr>
  <h3>🔐 GitHub API Settings</h3>
  <label>GitHub Token</label>
  <input id="token" placeholder="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">
  <label>Repo Owner</label>
  <input id="owner" value="Irbeem">
  <label>Repo Name</label>
  <input id="repo" value="YAPTcustomer">
  <label>Path to File</label>
  <input id="path" value="data.json">

  <button onclick="saveToGitHub()">💾 บันทึกข้อมูลกลับ GitHub</button>
  <pre id="status">📂 รอโหลดข้อมูล...</pre>

  <script>
    let jsonData = [];
    let sha = "";
    let allFields = [];

    const duplicateKeys = [
      "Order No.\nS/#",
      "Serial No. of Robot\nM/#",
      "Serial No. of Controller\nY/#"
    ];

    function get(id) {
      return document.getElementById(id).value.trim();
    }

    function buildForm(fields) {
      const container = document.getElementById("form-container");
      container.innerHTML = "";
      fields.forEach(key => {
        const label = document.createElement("label");
        label.textContent = key;
        const input = document.createElement("input");
        input.id = key;
        input.name = key;
        container.appendChild(label);
        container.appendChild(input);
      });
    }

    async function loadFromRawGitHub() {
      const rawUrl = "https://raw.githubusercontent.com/Irbeem/YAPTcustomer/main/data.json";
      const res = await fetch(rawUrl);
      if (!res.ok) {
        document.getElementById("status").textContent = "❌ โหลดจาก raw GitHub ไม่สำเร็จ";
        return;
      }
      jsonData = await res.json();
      allFields = Object.keys(jsonData[0] || {});
      buildForm(allFields);
      document.getElementById("status").textContent = `✅ โหลดข้อมูลสำเร็จ ${jsonData.length} รายการ`;
    }

    async function loadShaFromGitHubAPI() {
      const url = `https://api.github.com/repos/${get("owner")}/${get("repo")}/contents/${get("path")}`;
      const res = await fetch(url, {
        headers: { Authorization: `token ${get("token")}` }
      });
      if (!res.ok) {
        document.getElementById("status").textContent = "❌ โหลด SHA ไม่สำเร็จ";
        return;
      }
      const data = await res.json();
      sha = data.sha;
    }

    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      duplicateKeys.forEach(key => {
        const el = document.getElementById(key);
        if (el) el.classList.remove("duplicate");
      });

      const newEntry = {};
      allFields.forEach(key => {
        newEntry[key] = document.getElementById(key)?.value.trim() || "";
      });

      let hasDuplicate = false;
      for (const item of jsonData) {
        duplicateKeys.forEach(key => {
          if (item[key] === newEntry[key] && newEntry[key]) {
            const el = document.getElementById(key);
            if (el) el.classList.add("duplicate");
            hasDuplicate = true;
          }
        });
      }

      if (hasDuplicate) {
        document.getElementById("status").textContent = "⚠️ พบข้อมูลซ้ำในบางช่อง!";
        return;
      }

      jsonData.push(newEntry);
      document.getElementById("status").textContent = "➕ เพิ่มข้อมูลแล้ว (รวม: " + jsonData.length + ")";
      e.target.reset();
    });

    async function saveToGitHub() {
      await loadShaFromGitHubAPI();

      const url = `https://api.github.com/repos/${get("owner")}/${get("repo")}/contents/${get("path")}`;
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(jsonData, null, 2))));

      const payload = {
        message: "Update data.json via form",
        content: content,
        sha: sha
      };

      const res = await fetch(url, {
        method: "PUT",
        headers: {
          Authorization: `token ${get("token")}`,
          Accept: "application/vnd.github.v3+json"
        },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        document.getElementById("status").textContent = "✅ บันทึกสำเร็จ!";
        await loadFromRawGitHub(); // reload
      } else {
        const err = await res.json();
        document.getElementById("status").textContent = "❌ เกิดข้อผิดพลาด: " + err.message;
      }
    }

    // ✅ Load data automatically from GitHub on page load
    document.addEventListener("DOMContentLoaded", () => {
      loadFromRawGitHub();
    });
  </script>
</body>
</html>
